name: release

on:
  push:
    branches: [main]

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: go

  binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/arm64 windows/amd64; do
            os="${target%/*}" arch="${target#*/}" ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "hygienics-$os-$arch$ext" ./cmd/hygienics
          done
          sha256sum hygienics-* > checksums.txt
          gh release upload "$TAG" hygienics-* checksums.txt
