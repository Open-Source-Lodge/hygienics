name: observatory

# Check the changes of a pull request against the rules in .observatory,
# with the GitHub Copilot CLI.
on:
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # observatory needs the history back to the base branch
      - run: npm install -g @github/copilot
      - uses: Open-Source-Lodge/observatory@v1.0.3
        env:
          # A fine-grained personal access token with the "Copilot Requests" permission.
          # The token uses the Copilot subscription of its owner, not of the organization.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          OBSERVATORY_PROVIDER: copilot
          OBSERVATORY_MODEL: auto
